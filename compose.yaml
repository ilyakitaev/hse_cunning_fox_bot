services:
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: hse_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hse_bot
    ports:
      - "5000:5000"
    environment:
      - TELEGRAM_BOT_API=${TELEGRAM_BOT_API}
      - TELEGRAM_WEBHOOK_MODE=${TELEGRAM_WEBHOOK_MODE:-false}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
      - PROXY_URL=${PROXY_URL}
      - LLM_APIKEY=${LLM_APIKEY}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-https://api.minimax.io/v1/text/chatcompletion_v2}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_GRPC_PORT=6334
      - AUTH_PASSWORD=${AUTH_PASSWORD:-secret_password}
      - USE_WEBHOOK=${USE_WEBHOOK:-false}
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local
